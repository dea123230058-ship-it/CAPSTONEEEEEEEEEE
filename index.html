<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link rel="stylesheet" href="css/leaflet.photon.css">
        <link rel="stylesheet" href="css/leaflet-measure.css">
        <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
        }
        .header-bar {
            height: 60px;
            background-color: #1e293b;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
        }
        .header-bar h1 {
            font-size: 20px;
            font-weight: bold;
        }
        .header-bar .author {
            font-size: 14px;
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        #map {
            width: 100%;
            height: calc(100vh - 60px);
        }
        </style>
        <title>Peta Aksesibilitas</title>
    </head>
    <body>
        <div class="header-bar">
            <h1>Peta Aksesibilitas</h1>
            <div class="author">Dibuat Oleh: <strong>Kelompok 21</strong></div>
        </div>
        <div id="map">
        </div>
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script src="js/leaflet-measure.js"></script>
        <script src="data/AOI_1.js"></script>
        <script src="data/Polygon_Barriers_2.js"></script>
        <script src="data/Point_Barriers_3.js"></script>
        <script src="data/Facilities_4.js"></script>
        <script src="data/Demand_Points_5.js"></script>
        <script src="data/Line_Barriers_6.js"></script>
        <script src="data/Jaringan_jalan_7.js"></script>
        <script src="data/Lines_8.js"></script>
        <script>
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        }).fitBounds([[-5.577017651438881,105.20627215901023],[-5.526083578114675,105.26603068395643]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }

        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() { popup.update(); });
                            img.addEventListener('error', function() { popup.update(); });
                        }
                    }
                }
            }
        }

        var zoomControl = L.control.zoom({ position: 'topleft' }).addTo(map);
        var measureControl = new L.Control.Measure({
            position: 'topleft',
            primaryLengthUnit: 'meters',
            secondaryLengthUnit: 'kilometers',
            primaryAreaUnit: 'sqmeters',
            secondaryAreaUnit: 'hectares'
        });
        measureControl.addTo(map);

        var bounds_group = new L.featureGroup([]);

        // Base Map (Satelit ESRI)
        map.createPane('pane_ESRISatellite_0');
        map.getPane('pane_ESRISatellite_0').style.zIndex = 400;
        var layer_ESRISatellite_0 = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            pane: 'pane_ESRISatellite_0',
            opacity: 1.0,
            minZoom: 1,
            maxZoom: 28
        });
        map.addLayer(layer_ESRISatellite_0);

        // Layer 1: AOI
        function pop_AOI_1(feature, layer) {
            var popupContent = '<table><tr><td colspan="2">' + (feature.properties['NAMOBJ'] !== null ? autolinker.link(String(feature.properties['NAMOBJ']).toLocaleString()) : '') + '</td></tr></table>';
            layer.bindPopup(popupContent, { maxHeight: 400 });
        }
        function style_AOI_1_0() {
            return {
                pane: 'pane_AOI_1',
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                weight: 1.0, 
                fill: true,
                fillOpacity: 0.5,
                fillColor: 'rgba(232,113,141,1.0)'
            }
        }
        map.createPane('pane_AOI_1');
        map.getPane('pane_AOI_1').style.zIndex = 401;
        var layer_AOI_1 = new L.geoJson(json_AOI_1, {
            pane: 'pane_AOI_1',
            onEachFeature: pop_AOI_1,
            style: style_AOI_1_0,
        });
        bounds_group.addLayer(layer_AOI_1);
        map.addLayer(layer_AOI_1);

        // Layer 2: Polygon Barriers
        map.createPane('pane_Polygon_Barriers_2');
        map.getPane('pane_Polygon_Barriers_2').style.zIndex = 402;
        var layer_Polygon_Barriers_2 = new L.geoJson(json_Polygon_Barriers_2, {
            pane: 'pane_Polygon_Barriers_2',
            style: function() {
                return { color: 'rgba(35,35,35,1.0)', weight: 1.0, fill: true, fillColor: 'rgba(243,166,178,1.0)' };
            }
        });
        bounds_group.addLayer(layer_Polygon_Barriers_2);
        map.addLayer(layer_Polygon_Barriers_2);

        // Layer 3: Point Barriers
        map.createPane('pane_Point_Barriers_3');
        map.getPane('pane_Point_Barriers_3').style.zIndex = 403;
        var layer_Point_Barriers_3 = new L.geoJson(json_Point_Barriers_3, {
            pane: 'pane_Point_Barriers_3',
            pointToLayer: function (feature, latlng) {
                return L.circleMarker(latlng, { radius: 4.0, fillColor: 'rgba(213,180,60,1.0)', color: '#000', weight: 1, fillOpacity: 1 });
            }
        });
        bounds_group.addLayer(layer_Point_Barriers_3);
        map.addLayer(layer_Point_Barriers_3);

        // Layer 4: Facilities
        map.createPane('pane_Facilities_4');
        map.getPane('pane_Facilities_4').style.zIndex = 404;
        var layer_Facilities_4 = new L.geoJson(json_Facilities_4, {
            pane: 'pane_Facilities_4',
            pointToLayer: function (feature, latlng) {
                return L.circleMarker(latlng, { radius: 8.0, fillColor: 'rgba(84,176,74,1.0)', color: '#000', weight: 2, fillOpacity: 1 });
            }
        });
        bounds_group.addLayer(layer_Facilities_4);
        map.addLayer(layer_Facilities_4);

        // Layer 5: Demand Points
        map.createPane('pane_Demand_Points_5');
        map.getPane('pane_Demand_Points_5').style.zIndex = 405;
        var layer_Demand_Points_5 = new L.geoJson(json_Demand_Points_5, {
            pane: 'pane_Demand_Points_5',
            pointToLayer: function (feature, latlng) {
                return L.circleMarker(latlng, { radius: 5.0, fillColor: 'rgba(31,120,180,1.0)', color: '#000', weight: 1, fillOpacity: 1 });
            }
        });
        bounds_group.addLayer(layer_Demand_Points_5);
        map.addLayer(layer_Demand_Points_5);

        // Layer 6: Line Barriers
        map.createPane('pane_Line_Barriers_6');
        map.getPane('pane_Line_Barriers_6').style.zIndex = 406;
        var layer_Line_Barriers_6 = new L.geoJson(json_Line_Barriers_6, {
            pane: 'pane_Line_Barriers_6',
            style: function() {
                return { color: 'rgba(227,26,28,1.0)', weight: 3.0 };
            }
        });
        bounds_group.addLayer(layer_Line_Barriers_6);
        map.addLayer(layer_Line_Barriers_6);

        // Layer 7: Jaringan Jalan
        map.createPane('pane_Jaringan_jalan_7');
        map.getPane('pane_Jaringan_jalan_7').style.zIndex = 407;
        var layer_Jaringan_jalan_7 = new L.geoJson(json_Jaringan_jalan_7, {
            pane: 'pane_Jaringan_jalan_7',
            style: function() {
                return { color: 'rgba(255,127,0,1.0)', weight: 2.0 };
            }
        });
        bounds_group.addLayer(layer_Jaringan_jalan_7);
        map.addLayer(layer_Jaringan_jalan_7);

        // Layer 8: Lines
        map.createPane('pane_Lines_8');
        map.getPane('pane_Lines_8').style.zIndex = 408;
        var layer_Lines_8 = new L.geoJson(json_Lines_8, {
            pane: 'pane_Lines_8',
            style: function() {
                return { color: 'rgba(51,160,44,1.0)', weight: 2.5 };
            }
        });
        bounds_group.addLayer(layer_Lines_8);
        map.addLayer(layer_Lines_8);

        // Menambahkan Kontrol Layer / Legenda Peta di Kanan Atas
        var baseMaps = { "ESRI Satellite": layer_ESRISatellite_0 };
        var overlayMaps = {
            "Lines": layer_Lines_8,
            "Jaringan Jalan": layer_Jaringan_jalan_7,
            "Line Barriers": layer_Line_Barriers_6,
            "Demand Points": layer_Demand_Points_5,
            "Facilities": layer_Facilities_4,
            "Point Barriers": layer_Point_Barriers_3,
            "Polygon Barriers": layer_Polygon_Barriers_2,
            "AOI": layer_AOI_1
        };
        L.control.layers(baseMaps, overlayMaps, { collapsed: false }).addTo(map);

        </script>
    </body>
</html>
